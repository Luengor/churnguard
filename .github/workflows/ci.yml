name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  build:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.lower.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: lower
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/churnguard-api:${{ github.sha }}
            ghcr.io/${{ steps.lower.outputs.owner }}/churnguard-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY: ghcr.io
      REPO_OWNER: ${{ needs.build.outputs.owner_lc }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,REGISTRY,REPO_OWNER
          script: |
            cd "${{ secrets.VPS_REPO_DIR }}"
            git pull --ff-only origin main
            cp -n .env.example .env 2>/dev/null || true
            docker compose -f deploy/compose.yml pull
            docker compose -f deploy/compose.yml up -d --remove-orphans
