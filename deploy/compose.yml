services:
  api:
    image: ${REGISTRY:-ghcr.io}/${REPO_OWNER}/churnguard-api:${IMAGE_TAG:-latest}
    env_file: ../.env
    environment:
      CHURNGUARD_ONNX_PATH: /app/models/churn_xgb.onnx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CHURNGUARD_DOMAIN: ${CHURNGUARD_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
