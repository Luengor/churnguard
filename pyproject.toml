[project]
name = "churnguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "fastapi>=0.162.2",
    "mlflow>=3.18.0",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
